plugins {
    alias(libs.plugins.android.application)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.pi.gestaohorariosenfermagemmobile'
    compileSdk 36 // Ajustado para versão estável

    defaultConfig {
        applicationId "com.pi.gestaohorariosenfermagemmobile"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // LER O IP DO LOCAL.PROPERTIES OU USAR O PADRÃO SE NÃO EXISTIR
        buildConfigField "String", "BASE_URL", localProperties.getProperty("BASE_URL", "\"http://10.0.2.2:8000/api/\"")

        resValue "string", "config_web_host", localProperties.getProperty("WEB_HOST", "10.0.2.2")
        resValue "string", "config_web_port", localProperties.getProperty("WEB_PORT", "3000")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // NECESSÁRIO PARA GERAR A CLASSE BUILDCONFIG NO JAVA
    buildFeatures {
        buildConfig true
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // RETROFIT E GSON PARA API
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}